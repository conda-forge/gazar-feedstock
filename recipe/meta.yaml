{% set name = "gazar" %}
{% set version = "0.0.5" %}
{% set sha256 = "58238b0f2cc5807c7f81081c57d7c95fc7ddec9469289043c00dc4b2e6706168" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - affine
    - appdirs
    - gdal=2.2.*
    - pyproj
    - utm

test:
  requires:
    - python {{ python_min }}
  imports:
    - gazar
    - gazar.grid
    - gazar.shape
    - gazar.log

about:
  home: https://github.com/snowman2/gazar
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'A collection of functions to use with GDAL.'
  description: |
    A collection of functions to use with GDAL. It also
    includes a wrapper for gdal.Dataset with useful methods
    and attributes.
  doc_url: http://gazar.readthedocs.io
  dev_url: https://github.com/snowman2/gazar

extra:
  recipe-maintainers:
    - snowman2
